[project]
name = "process-gpt-deepagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==1.1.0",
    "deepagents==0.6.8",
    "docker>=7.0",
    "fastmcp>=2.0",
    "langchain==1.3.4",
    "langchain-anthropic==1.4.4",
    "langchain-core==1.4.2",
    "langchain-mcp-adapters==0.2.2",
    "langchain-openai==1.2.2",
    "langgraph==1.2.4",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp==1.27.2",
    "process-gpt-agent-sdk[sse,auth]==0.6.0",
    "protobuf==6.33.6",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "pymupdf>=1.24",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "starlette==1.2.1",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx2>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
