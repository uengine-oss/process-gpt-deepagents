# deepagents
# - .env 가 필요합니다(.env.example 를 복사).
# - 컨테이너 안에서는 localhost 가 호스트가 아니므로, Supabase CLI(호스트) 는 SUPABASE_URL 을
#   host.docker.internal 로 덮어씁니다(.env 의 127.0.0.1 은 venv 용으로 유지).
# - LLM 프록시(LiteLLM 등)를 호스트에서 띄운 경우 .env 의 LLM_PROXY_URL=http://localhost:4000 은
#   컨테이너에서 실패합니다. deepagents.environment 에
#   LLM_PROXY_URL=http://host.docker.internal:4000 를 추가하거나 .env 를 위 호스트명으로 맞추세요.

services:
  # Builds from ./Dockerfile; CMD runs `python deepagents_server.py` (repo root copied to /app).
  deepagents:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/uengine-oss/process-gpt-deepagents:latest
    container_name: deepagents
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - SKILLS_ROOT_DIR=/app/skills
      - SKILL_CATALOG_DIR=/app/skill-catalog
      # SKILL_REPO_URLS 는 기본값이 코드에 내장. 기본 레포를 교체/추가하려면 아래 주석 해제.
      # - SKILL_REPO_URLS=https://github.com/anthropics/skills,https://github.com/K-Dense-AI/claude-scientific-skills
      - DB_HOST=host.docker.internal
      - SUPABASE_URL=http://host.docker.internal:54321
      - MEMENTO_RETRIEVE_URL=http://host.docker.internal:8005/retrieve
    env_file:
      - .env
    volumes:
      # Tenant-uploaded skills (persistent across restarts)
      - skills-data:/app/skills
      # GitHub-fetched catalog skills (persistent across restarts)
      - skill-catalog-data:/app/skill-catalog
    restart: unless-stopped

volumes:
  # Tenant-uploaded skills
  skills-data:
    driver: local
  # GitHub catalog skills downloaded at startup
  skill-catalog-data:
    driver: local

networks:
  default:
    name: deepagents-network
