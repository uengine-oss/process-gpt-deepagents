# claude-skills backend + deepagents (스킬 볼륨 공유).
# - backend 는 제공하신 정의를 그대로 사용합니다. 빌드하려면 monorepo 의 packages/backend 를 두거나,
#   backend 서비스에서 주석 처리된 image: ghcr.io/uengine-oss/claude-skills:latest 를 쓰세요.
# - backend 의 ./config.example.json 바인드는 claude-skills 레포에 해당 파일이 있어야 합니다.
# - deepagents 는 .env 가 필요합니다(.env.example 를 복사).
# - 컨테이너 안에서는 localhost 가 호스트가 아니므로, Supabase CLI(호스트) 는 SUPABASE_URL 을
#   host.docker.internal 로 덮어씁니다(.env 의 127.0.0.1 은 venv 용으로 유지).
# - LLM 프록시(LiteLLM 등)를 호스트에서 띄운 경우 .env 의 LLM_PROXY_URL=http://localhost:4000 은
#   컨테이너에서 실패합니다. deepagents.environment 에
#   LLM_PROXY_URL=http://host.docker.internal:4000 를 추가하거나 .env 를 위 호스트명으로 맞추세요.

services:
  claude-skills:
    image: claude-skills-backend:latest 
    container_name: claude-skills
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - SKILLS_STORAGE_PATH=/app/skills
    volumes:
      # Configuration file (read-only)
      - ./config.example.json:/app/config.json:ro
      
      # Persistent storage for uploaded skills
      # Required for skill uploads to persist across container restarts
      - claude-skills-data:/app/skills
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8765", "--config", "/app/config.json", "--verbose"]

  # Builds from ./Dockerfile; CMD runs `python deepagents_server.py` (repo root copied to /app).
  deepagents:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepagents
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - SKILLS_ROOT_DIR=/app/skills
      # GitHub 카탈로그 스킬은 볼륨에 없을 수 있음 — sandbox_copy_mounted_skill 이 HTTP로 물리화할 때 사용
      - PROCESSGPT_SKILLS_API_BASE_URL=http://claude-skills:8765
      # .env 의 SUPABASE_URL(127.0.0.1) 대신 호스트 Supabase CLI API
      - SUPABASE_URL=http://host.docker.internal:54321
      - DB_HOST=host.docker.internal
      - LLM_PROXY_URL=http://host.docker.internal:4000
    env_file:
      - .env
    volumes:
      - claude-skills-data:/app/skills
    depends_on:
      claude-skills:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume for persistent skill storage
  # Ensures uploaded skills persist across container restarts and updates
  claude-skills-data:
    driver: local

networks:
  default:
    name: claude-skills-network
