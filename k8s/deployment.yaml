apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-gpt-deepagents
  namespace: dev
  labels:
    app.kubernetes.io/name: process-gpt-deepagents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: process-gpt-deepagents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: process-gpt-deepagents
    spec:
      containers:
        - name: process-gpt-deepagents
          image: ghcr.io/uengine-oss/process-gpt-deepagents:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: skills-storage
              mountPath: /app/skills
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-secret
                  key: ANTHROPIC_API_KEY
            - name: LLM_MODEL
              value: "anthropic:claude-opus-4-6"
            - name: SKILLS_ROOT_DIR
              value: "/app/skills"
            - name: SANDBOX_BASE_DIR
              value: "/tmp"
            - name: MEMENTO_RETRIEVE_URL
              value: "http://localhost:8005/retrieve"
            - name: SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: SUPABASE_URL
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: SERVICE_ROLE_KEY
            - name: SUPABASE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: JWT_SECRET
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: my-secrets
                  key: DB_PORT
      volumes:
        - name: skills-storage
          persistentVolumeClaim:
            claimName: claude-skills-storage-rwx
---
apiVersion: v1
kind: Service
metadata:
  name: process-gpt-deepagents
  namespace: dev
  labels:
    app.kubernetes.io/name: process-gpt-deepagents
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: process-gpt-deepagents
  ports:
    - name: http
      port: 8888
      targetPort: 8888
